<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No user-scalable=no. The canvas has its own zoom, which is why it was there
     - but browser zoom is also how a low-vision user reads the sidebar, the
     menus and the item names, none of which the canvas zoom touches. Taking
     the page's zoom away to protect a gesture is a bad trade. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mbrd</title>
<meta name="description" content="An infinite freeform moodboard. Drop in anything, place it anywhere. Runs entirely in your browser.">
<meta name="author" content="valjdakosta">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf8f3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<!-- A PNG, and it has to be: iOS does not read an SVG here, so the home-screen
     icon of an app added from Safari was falling back to a screenshot of the
     page. The 192 is scaled down to whatever the device wants. -->
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  /* Before first paint: apply the saved look - whimsy level, palette, and any
     per-token overrides - so an installed PWA never flashes the default
     pigment on launch. An unset whimsy is the middle, which is what the bare
     stylesheet already renders, so the common case sets nothing at all. */
  try {
    var s = JSON.parse(localStorage.getItem('mbrd.appearance') || '{}');
    /* != null, not truthiness: 0 is Softish, a real level with its own rules. */
    if (s.whimsy != null) document.documentElement.dataset.whimsy = s.whimsy;
    if (s.palette) document.documentElement.dataset.palette = s.palette;
    /* The quality dial, for the same reason and from its own key: a phone left
       on Light should not be shown one blurred, shadowed frame first. Held to
       the three known stops rather than trusted, because this reaches the page
       as an attribute selector - see quality.js. */
    var q = JSON.parse(localStorage.getItem('mbrd.quality') || '{}');
    if (q && /^(light|balanced|full)$/.test(q.level)) document.documentElement.dataset.quality = q.level;
    /* The per-token overrides are the only part of a saved look that reaches the
       page as CSS, and this runs before ui/look.js can filter them - so it
       carries the same guard inline. A poisoned same-origin store could
       otherwise apply { "display": "none" } or a token holding url(...) and fire
       an outbound request before first paint; the module re-filters through
       safeVars() a moment later, and this closes the window before it. Key must
       be a custom property, value must match the token grammar, and every
       function it calls must be an arithmetic or colour one. Held in step with
       look.js by tests/appearance.test.js. See AUD-15. */
    var SAFE_VALUE = /^[-a-z0-9#%.,()/+*_'" ]{1,160}$/i;
    var SAFE_FN = /^(rgb|rgba|hsl|hsla|hwb|lab|lch|oklab|oklch|color|color-mix|calc|min|max|clamp|var|cubic-bezier|steps|linear)$/;
    var vars = s.vars || {};
    for (var k in vars) {
      if (!/^--[a-z0-9-]+$/i.test(k)) continue;
      var v = vars[k];
      if (typeof v !== 'string' || !SAFE_VALUE.test(v)) continue;
      var fns = v.match(/[a-z][a-z0-9-]*\s*\(/gi) || [], ok = true;
      for (var i = 0; i < fns.length; i++) {
        if (!SAFE_FN.test(fns[i].replace(/\s*\($/, '').toLowerCase())) { ok = false; break; }
      }
      if (ok) document.documentElement.style.setProperty(k, v);
    }
  } catch (e) {}
</script>
</head>
<body>

<!-- The boot cover, over the page until main.js has a board on it.

     What it hides is not a slow app so much as an ugly order of events: the
     paper, the grid and the whole of the chrome are in the document at first
     paint, while the board itself comes out of IndexedDB several awaits later -
     so without this the app opens as a finished, empty room and then has its
     furniture carried in one piece at a time. A cover holds that back until
     there is something to show.

     Every part of it is inert: no ids anything else looks up, no state, and the
     node deletes itself after the fade (dismissSplash in main.js). aria-hidden
     because a screen reader has no use for a curtain - and nothing here is
     content, only the app's own name while it gets ready.

     The <noscript> below is the honest exit for a visitor with JavaScript off.
     Nothing in mbrd works without it, but a permanently covered page cannot
     even say so; uncovering at least shows the board it will not be able to
     fill. -->
<noscript><style>#splash { display: none !important; }</style></noscript>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-word">mbrd.</div>
    <div class="splash-sub">Plan it, see it. Sorted.</div>
    <!-- Three cards landing on a board with threads snapping between them - the
         app's own signature (canvas/web.js), which is why the loader is this
         and not a spinner. It is a CSS animation for the same reason #busy's
         bar is one: the work it covers is on the main thread, so anything
         driven from JavaScript would freeze at exactly the moment somebody is
         watching it to find out whether the app has hung.

         Five elements alternating card / thread / card, in that order, because
         the CSS staggers them by nth-child and the sequence *is* the animation:
         a card arrives, a thread reaches for the next one, and so on. -->
    <div class="splash-thread">
      <i class="splash-card"></i><i class="splash-line"></i><i class="splash-card"></i><i class="splash-line"></i><i class="splash-card"></i>
    </div>
  </div>
</div>
<script>
  /* Two jobs, both of them failsafes, and neither belongs in a module: this has
     to run whether or not main.js ever parses.

     One - hold the wordmark back until the display face has landed. Every
     bundled face is `font-display: swap`, so a cover shown for 300ms would
     otherwise set the name in Times, then swap it to Fraunces, and the last
     thing the eye catches before the board appears would be the app's own name
     changing shape. The face is asked for by reading it off the element rather
     than naming it here: which one it is depends on the whimsy level restored
     a moment ago, and the whole stack is a legal font shorthand, so a level
     set in the sans asks for the sans and no board fetches a serif it is not
     going to show. Not document.fonts.ready, which answers "is anything still
     loading" - and at this point in the document the answer is no, because
     layout has not reached the wordmark and so has not asked for its font yet.

     Two - uncover the page if boot never happens. main.js normally does it (and
     does it as soon as there is a board, which is well before this fires); this
     is for the load that fails - a module 404 behind a stale service worker, a
     syntax error, a browser below the floor. Six seconds because its only job
     is to rescue a boot that is not coming, and firing early on a big board
     would pull the cover off a half-built one. */
  (function () {
    var s = document.getElementById('splash');
    if (!s) return;
    var letter = function () { s.classList.add('is-lettered'); };
    try {
      var word = s.querySelector('.splash-word');
      if (document.fonts && document.fonts.load && word) {
        var css = getComputedStyle(word);
        document.fonts.load(css.fontWeight + ' 1em ' + css.fontFamily, 'mbrd.')
          .then(letter, letter);
        setTimeout(letter, 1200);
      } else letter();
    } catch (e) { letter(); }
    /* #load is the dev switch that holds the cover up to be looked at (see
       dismissSplash in main.js). It has to be honoured here too, or the rescue
       timer would take the thing away six seconds into watching it. */
    addEventListener('load', function () {
      if (location.hash.indexOf('load') !== -1) return;
      setTimeout(function () { s.classList.add('is-done'); }, 6000);
    });
  })();
</script>

<!-- The stock the board is printed on: a tile of 300gsm grain multiplied over
     the paper on <body>. Outside #viewport rather than inside it, because
     #viewport has paint containment and so is a stacking context - a blend
     inside one has nothing behind it to blend with. canvas/grain.js moves it
     with the board; see the #grain rule in app.css for the rest. -->
<div id="grain" aria-hidden="true"></div>

<!-- The canvas. #viewport is fixed to the window and paints the grid; #world is
     the single transformed layer every item lives in (see canvas/viewport.js). -->
<div id="viewport">
  <!-- The tint outside the Mobile strip. It used to be a 100vmax spread shadow
       on the sheet below, which meant the whole window was repainted every time
       the board scrolled a pixel. A shadow is clipped to outside its element's
       border box, radius included, so a wash laid under an opaque rounded sheet
       is the same picture - and this one never moves. -->
  <div id="mobile-surround" aria-hidden="true"></div>
  <!-- The finite Mobile sheet sits below the grid so its opaque near-white can
       carry palette colour without washing the lattice out. canvas/mobile-frame.js
       positions it, clipped to the window, while the items remain in #world. -->
  <div id="mobile-board-frame" aria-hidden="true"></div>
  <!-- The lattice at the plain end of the whimsy axis, which is drawn rather
       than tiled - see canvas/grid.js for why a background image could not be
       made to hold still. The other two tiers leave it empty and paint the
       viewport's own background instead. It remains under the axes, the origin
       mark and every item, but above the Mobile sheet. -->
  <canvas id="grid-ink" aria-hidden="true"></canvas>
  <!-- A standard sheet outlined round the origin, off unless View asks for one.
       Over the lattice and under the axes, the way a page sits on a desk with
       the rules drawn across it. See canvas/paper.js. -->
  <div id="paper" hidden aria-hidden="true"><span id="paper-label"></span></div>
  <!-- The world axes. A canvas rather than two 1px <div>s, and the reason is
       the one thing an element cannot promise: that it covers exactly one
       device pixel. Layout works in sixty-fourths of a CSS pixel, and one
       device pixel is a whole number of those only at 100% and 200% scaling -
       at 125%, 150% or a phone's 3x it is not, so the rule came out a hair
       under a full row, and at the offsets where that shortfall straddled a
       boundary the row rounded away to nothing and the axis blinked out while
       the board was panned. On a canvas a pixel is set or it is not.
       Its own layer, separate from the grid, because the grid cuts a hole in
       itself where the origin mark stands and the axes must not be cut by it. -->
  <canvas id="axis-ink" aria-hidden="true"></canvas>
  <!-- The Mobile masthead. A screen-space 3:2 band, as wide as the board,
       standing on the strip's top edge with the board's name set across it.
       The room above the edge is made by the pan clamp - see
       mobileHeaderHeight() in canvas/viewport.js - so this is real space at the
       head of the board rather than a plate laid over the first row of items,
       and scrolling down carries it away like anything else on the board. -->
  <div id="mobile-board-header"><h1 id="mobile-board-title"></h1></div>
  <svg id="origin-mark" viewBox="0 0 36 36" fill="none" stroke="currentColor" aria-hidden="true">
    <!-- The ring comes in all three shapes and the whimsy axis picks one: a
         circle at the soft end, a rounded square in the middle where the cards
         are rounded too, a hard square at the plain end. An SVG shape is the
         shape it is - a circle cannot be squared off with a border-radius the
         way a box can - so each stop gets its own geometry rather than a
         rounding of one. All are inert markup; app.css shows exactly one. -->
    <circle class="om-ring" cx="18" cy="18" r="10" stroke-width="1.3"/>
    <rect class="om-ring-rd" x="8" y="8" width="20" height="20" rx="5" stroke-width="1.3"/>
    <rect class="om-ring-sq" x="8" y="8" width="20" height="20" stroke-width="1.3"/>
    <circle class="om-pip" cx="18" cy="18" r="2" fill="currentColor" stroke="none"/>
    <rect class="om-pip-sq" x="16" y="16" width="4" height="4" fill="currentColor" stroke="none"/>
    <!-- The four ticks that used to radiate out to the edge of this box are
         gone. They drew a crosshair on top of the one the axes already make -
         the same cross, twice, a few pixels thick in the middle of the board. -->
  </svg>
  <div id="world">
    <!-- Shadows live in one underlay so a front card cannot cast its shadow
         across the face of a card behind it. canvas/items.js mirrors each
         mounted item's geometry here. -->
    <div id="item-shadows" aria-hidden="true"></div>
  </div>
  <div id="marquee" hidden></div>
</div>

<aside id="sidebar" aria-hidden="true">
  <header class="side-head">
    <div class="wordmark">
      <h1>mbrd.</h1>
      <span class="sub">Plan it, see it. Sorted.</span>
    </div>
    <button id="side-close" type="button" aria-label="Close menu" title="Close">
      <!-- Two crossed strokes rather than a "times" glyph: a character's ink is
           not centred in its line box, so the glyph orbits when it spins. -->
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M4 4l8 8M12 4l-8 8"/>
      </svg>
    </button>
  </header>
  <!-- Three tabs, and the panel opens on the first of them every time. The
       sections are built by ui/panel.js from ui/settings-schema.js: this used
       to be six hundred lines of markup that had to be kept in step by hand
       with the wiring next door, and the order it grew into was nobody's
       decision. The strip and the body below it are the whole of the shell.

       All three panels stay in the document, hidden bar one, which is what
       keeps each tab's scroll position and what lets the panel be built once -
       ui/appearance.js and canvas/audio.js hold elements from in here by id,
       and a rebuild would leave them holding nodes no longer in the page. -->
  <div class="side-tabs"></div>
  <div class="side-body"></div>

  <!-- The credit sits at the quiet end on purpose. An anchor and nothing else:
       no logo request, no analytics, no font from anywhere - the same rule the
       link cards follow, so an offline board still renders this footer exactly
       as an online one does. rel carries noopener because every outbound link
       in this app does. -->
  <footer class="side-foot">
    <span id="version"></span>
    <a class="by" href="https://link.valjdakosta.com" target="_blank" rel="noopener noreferrer">valjdakosta</a>
  </footer>
</aside>

<!-- The masthead's own panel, and its own sheet rather than a section of the
     one next door.
     Everything in here styles one thing - the name across the top of a Mobile
     board - and it is reached by pointing at that name, not by going to the
     menu and looking for it. A panel opened from the thing it edits should
     hold that thing and nothing else; folded into the main sidebar it arrived
     with the board actions, the arrangement, the look and the keyboard legend
     above it, and the pen had to scroll the panel to its own section to make
     up the difference.
     Same sheet, same head, same body - it borrows every class - but it comes
     in from the right, under the pen that opens it, so the two panels are
     never the same piece of screen and either can be open without the other.
     It sits here, after #sidebar and before the corner furniture, because the
     rules that get out of a panel's way are written with `~`. -->
<aside id="header-panel" aria-hidden="true">
  <header class="side-head">
    <!-- No subtitle under this one. The wordmark's sub line is the app saying
         what it is, once, on the panel that opens with the app; a second panel
         repeating the trick would be a caption explaining a word that needs no
         explaining - you opened it from the masthead. -->
    <div class="wordmark">
      <h1>Header</h1>
    </div>
    <button id="header-close" type="button" aria-label="Close header options" title="Close">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M4 4l8 8M12 4l-8 8"/>
      </svg>
    </button>
  </header>
  <div class="side-body">
    <section class="side-sec" id="mobile-header-settings" tabindex="-1">
      <label class="field">
        <span>Font</span>
        <select id="mobile-header-font"></select>
      </label>
      <div id="mobile-header-weight"></div>
      <!-- Three dials, because they are three questions. Size is how big the
           name is set - a percentage of the strip's width, so it holds across
           phones. Height is the same letters stretched vertically and left
           exactly as wide, which is a thing type does on a title page and a
           thing no size control can do; it runs to five times, past the point
           where the band's own overflow starts cutting the letters off, and
           holds a detent at 100% so the face as drawn is a stop you can find
           without aiming. It grows evenly up and down about the name's own
           middle - see #mobile-board-title in app.css.
           Line height is the room between the lines of a name that wraps, and
           its 100% is the face's own - see DEFAULT_MOBILE_HEADER. -->
      <label class="field">
        <span>Font size <output id="mobile-header-size-out">13%</output></span>
        <input id="mobile-header-size" type="range" min="7" max="24" step="0.5" value="13">
      </label>
      <label class="field">
        <span>Font height <output id="mobile-header-stretch-out">100%</output></span>
        <input id="mobile-header-stretch" type="range" min="50" max="500" step="1" value="100">
      </label>
      <label class="field">
        <span>Line height <output id="mobile-header-leading-out">Auto</output></span>
        <input id="mobile-header-leading" type="range" min="60" max="250" step="1" value="100">
      </label>
      <label class="field">
        <span>Vertical position <output id="mobile-header-offset-out">Center</output></span>
        <input id="mobile-header-offset" type="range" min="-50" max="50" step="1" value="0">
      </label>
      <label class="check">
        <input type="checkbox" id="mobile-header-italic"> Italic
      </label>
      <!-- Checked is the ordinary state, so this is phrased as the thing it
           does rather than as the thing it stops - "Don't wrap" would be a box
           you tick to make something not happen. Unticked the name is one line
           at whatever width it comes to, and the band's overflow is what
           decides how much of it you see. -->
      <label class="check">
        <input type="checkbox" id="mobile-header-wrap" checked> Wrap long names
      </label>
      <div id="mobile-header-axes"></div>
      <p class="hint">Variable controls come from the selected font.</p>
      <!-- The way back. Every control above it is a dial you can leave anywhere,
           and a panel of dials with no way home is a panel you stop touching -
           the same reason Appearance keeps a "Start over" at the foot of its
           advanced fold. It puts the masthead back to the face the look is set
           in at the size it was, and nothing else on the board moves. -->
      <div class="btn-row">
        <button type="button" id="mobile-header-reset">Start over</button>
      </div>
    </section>
  </div>
</aside>

<button id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">
  <span></span><span></span><span></span>
</button>

<!-- At the Mobile board's top stop, this opens the masthead's panel. It borrows
     the note pen so the action reads as editing, not as a second menu. -->
<button id="mobile-header-edit-btn" type="button" hidden aria-expanded="false"
        aria-label="Edit Mobile header" aria-controls="header-panel">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M11.4 2.6a1.6 1.6 0 0 1 2.2 2.2L6.3 12.1l-3 .8.8-3z"/>
  </svg>
</button>

<!-- The bin. Opposite corner to the zoom controls, and deliberately the same
     kind of object: a small permanent affordance on the glass rather than
     something buried in the panel. Its list is built by ui/trash.js. -->
<div id="bin">
  <!-- The pop-up and, beside it, the title card's restore button. The button
       rides the panel rather than the dock below: it belongs to "what did I
       throw away", which is what the open panel is, so it sits next to the
       pop-up and not next to the trash button that opens it. -->
  <div class="bin-pop">
    <div id="bin-panel" hidden role="dialog" aria-label="Trash">
      <header>
        <h2>Trash</h2>
        <button type="button" id="bin-empty" title="Throw it all out">Empty</button>
      </header>
      <div id="bin-list"></div>
      <p id="bin-none">Nothing thrown away yet.</p>
      <p id="bin-hint">Drag anything back onto the board.</p>
    </div>
    <!-- The Desktop title card, when it has been thrown away, is not filed in the
         bin among ordinary items - it is a singleton the board is meant to have.
         So it gets its own way back: this small square appears beside the open
         pop-up while the card is gone, and one press restores it. Hidden to start
         and toggled by ui/trash.js. -->
    <button type="button" id="title-restore" hidden
            aria-label="Bring back the title card" title="Bring back the title card">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 4.5h8"/>
        <path d="M8 4.5v7"/>
      </svg>
    </button>
  </div>
  <!-- The autosave, saying so. Absolutely placed rather than stacked in the
       column, because it comes and goes: a slot held open for it would be a
       permanent gap above the bin for the sake of something visible two seconds
       in every minute. aria-hidden because this is a reassurance and not an
       announcement - a screen reader hearing "Saved" every few seconds while
       you work is the same information turned into an interruption. The
       explicit Save still says so out loud, because that one was a question. -->
  <div id="saved" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 8.5l3 3 6-7"/>
    </svg>
    <span>Saved</span>
  </div>
  <!-- One row along the bottom of the corner. The bin keeps the corner itself,
       because that is where it has always been and where the panel above it is
       anchored; undo and redo are added to its right rather than around it. -->
  <div class="bin-row">
    <!-- Named as empty here because that is what it is before any board has
         loaded, and it matches the muted look the button starts in; ui/trash.js
         rewrites both the label and the tooltip every time the bin changes. -->
    <button type="button" id="bin-btn" aria-label="Trash, empty" aria-expanded="false" aria-controls="bin-panel" title="Trash, empty">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 4h11"/>
        <path d="M6 4V2.5h4V4"/>
        <path d="M3.8 4l.6 9a1 1 0 0 0 1 1h5.2a1 1 0 0 0 1-1l.6-9"/>
        <path d="M6.6 6.5v5M9.4 6.5v5"/>
      </svg>
    </button>
    <!-- Undo and redo. Beside the bin because they belong to the same thought -
         the bin is the one mistake you can walk back by hand, and these are
         every other one - and a segmented pair like the zoom cluster opposite,
         because that is what this app's furniture looks like.

         Both start disabled: a freshly loaded board has no history, and the
         titles are rewritten by main.js with the name of what would actually
         happen ("Undo Add 3 items"). -->
    <div id="history-ctl">
      <button type="button" data-history="undo" aria-label="Undo" title="Nothing to undo" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6.5h6.2a3.4 3.4 0 0 1 0 6.8H6.4"/>
          <path d="M5.6 3.6 2.7 6.5l2.9 2.9"/>
        </svg>
      </button>
      <button type="button" data-history="redo" aria-label="Redo" title="Nothing to redo" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 6.5H6.8a3.4 3.4 0 0 0 0 6.8h2.8"/>
          <path d="M10.4 3.6l2.9 2.9-2.9 2.9"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="corner">
  <!-- A stick of known length, the way a map carries one. See ui/scalebar.js
       for why this is a drawn bar and not a printed ratio. Hidden by the module
       when no round length fits, so it has no [hidden] here - it starts visible
       and the first paint decides. -->
  <div id="scale-bar" aria-hidden="true">
    <span id="scale-bar-label">1 cm</span>
    <span id="scale-bar-stick"></span>
  </div>
  <div id="zoom-ctl">
    <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out  −">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M4 8h8"/>
      </svg>
    </button>
    <button type="button" id="zoom-level" data-zoom="reset" title="Back to 100%">100%</button>
    <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in  +">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M8 4v8M4 8h8"/>
      </svg>
    </button>
    <button type="button" data-zoom="fit" aria-label="Zoom to fit" title="Zoom to fit  F">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/>
      </svg>
    </button>
    <button type="button" data-zoom="home" aria-label="Back to 0,0" title="Back to 0,0  0">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="4"/>
        <path d="M8 1v2.4M8 12.6V15M1 8h2.4M12.6 8H15"/>
      </svg>
    </button>
    <!-- Hold the magnification. Last in the row and pressed rather than pushed,
         because it is the only control here that changes what the other four
         do rather than doing something itself.

         The body of the padlock is one path and the shackle is two, of which
         app.css shows whichever matches aria-pressed - an open shackle leaning
         off its post when the zoom is free, closed on it when it is not. Two
         paths rather than a rotation, because the shape a padlock makes when it
         opens is not the shape it makes when it is turned. main.js writes the
         pressed state, the label and the title together. -->
    <button type="button" id="zoom-lock" data-zoom="lock" aria-pressed="false"
            aria-label="Lock zoom" title="Lock the zoom">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect class="lock-body" x="3.25" y="7.25" width="9.5" height="6.5" rx="1.4"/>
        <path class="lock-open" d="M5.75 7.25V5.1a2.6 2.6 0 0 1 5.15-.5"/>
        <path class="lock-shut" d="M5.75 7.25V5.1a2.25 2.25 0 0 1 4.5 0v2.15"/>
      </svg>
    </button>
  </div>
  <div id="hud">
    <span id="hud-xy">0, 0</span>
    <span id="hud-count">nothing yet</span>
  </div>
</div>

<!-- Phones only; app.css keeps it out of the way at every other width. Getting
     something onto the board is the one thing you come here to do, and on a
     phone it was two taps into a panel that covers the screen - while the four
     corners were spent on view controls you need only once something is
     already there. So it is one bar along the bottom edge, under the thumb.

     Split, because "add" is honestly two verbs: bring something in, or write
     something down. One button would have had to pick a default, and the other
     half is not a secondary action - a moodboard is as often a sentence as a
     photograph.

     Files on the left, note on the right. Swapped in the markup rather than
     with row-reverse, so the tab order and the reading order stay the same as
     what is on screen. -->
<div id="add-bar">
  <button type="button" data-add="files">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <path d="M8 3.2v9.6M3.2 8h9.6"/>
    </svg>
    <span>Files</span>
  </button>
  <button type="button" data-add="note">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11.4 2.6a1.6 1.6 0 0 1 2.2 2.2L6.3 12.1l-3 .8.8-3z"/>
    </svg>
    <span>Note</span>
  </button>
</div>

<!-- What is playing, and the controls for it. Built by ui/nowplaying.js, which
     fills .np-transport with the same buildTransport() the card uses - the
     waveform in here and the waveform on the card are two views of one <audio>,
     so neither has to be told what the other did.

     Along the foot between the bin and the zoom cluster, which is where a
     transport has lived on every player anybody has used. On a phone that edge
     belongs to the add bar, so app.css lifts this above it rather than moving
     it - the two are never the same piece of screen.

     hidden to start: there is nothing playing when a board opens, and a bar
     announcing silence is furniture with no job. -->
<div id="nowplaying" hidden>
  <span class="np-name"></span>
  <div class="np-transport"></div>
  <!-- The global volume, the same one the sidebar's slider writes. Not a
       per-clip level: canvas/audio.js keeps one for the whole board, on the
       grounds that it is a property of the room and not of any one recording.
       The module removes this whole block where the browser will not honour a
       write to it - see volumeLocked(). -->
  <label class="np-volume">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M3 6h2.4L8.8 3.1v9.8L5.4 10H3z" fill="currentColor"/>
      <path d="M11 5.6a3.4 3.4 0 0 1 0 4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <input id="np-volume" type="range" min="0" max="100" step="1" value="60" aria-label="Volume">
  </label>
  <button type="button" class="np-close" aria-label="Close the player" title="Stop and close">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <path d="M4 4l8 8M12 4l-8 8"/>
    </svg>
  </button>
</div>

<div id="drop-overlay" hidden><div>let it fall</div></div>

<!-- The waiting strip. Driven by busy() in util.js; see the note there for why
     it lives in the same file as the toast and how the two differ.

     Pinned at the top, opposite the toast at the foot, and the split is the
     point: what is happening arrives at one edge, what happened arrives at the
     other, so a report never overwrites a progress bar and the two can be on
     screen at once without either being in the way.

     aria-live=polite rather than assertive - a screen reader should hear "this
     is going to take a moment" when it reaches a pause, not have the sentence
     it is currently reading cut in half. -->
<div id="busy" role="status" aria-live="polite" hidden>
  <div class="busy-head">
    <span id="busy-label"></span>
    <span id="busy-count"></span>
  </div>
  <div id="busy-track"><div id="busy-fill"></div></div>
</div>

<!-- role=status + aria-live: "Saved in this browser", "Export failed" and the
     missing-asset warnings are the app's only reply to a save, and without
     these a screen reader never hears any of them. -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- The one question this app stops to ask. A real <dialog>, opened with
     showModal(), because that is what buys the focus trap, the Escape key, the
     top layer and the inert background without any of it being written by
     hand - and because the native confirm() it replaces is a browser chrome
     box that says "localhost:6273 says" above the sentence.
     Text and buttons are filled in by ui/dialog.js; the markup is here so the
     first time it is needed is not also the first time it is built. -->
<dialog id="ask" aria-labelledby="ask-title">
  <h2 id="ask-title"></h2>
  <p id="ask-body"></p>
  <!-- Only some questions want an answer typed rather than picked. Hidden
       unless ask() was handed a `field`, in which case the dialog resolves to
       what was typed instead of to which button was pressed. -->
  <input id="ask-field" type="text" autocomplete="off" hidden>
  <div class="ask-row">
    <!-- The way out that loses nothing sits apart from the other two, at the
         far end of the row, so it is not one of a pair of near-identical
         buttons where the wrong one is unrecoverable. -->
    <button type="button" id="ask-keep"></button>
    <span class="ask-gap"></span>
    <button type="button" id="ask-cancel"></button>
    <button type="button" id="ask-go" class="danger"></button>
  </div>
</dialog>

<input id="file-input" type="file" multiple hidden>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
