<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="mbrd">
  <!-- Maskable variant: same three cards, no corner radius of its own because
       the OS supplies the shape, and the group scaled into the inner 80% safe
       zone so a circle mask cannot clip a card. The dot grid stays full-bleed -
       it is background, and losing its outer ring to a mask costs nothing.

       0.74 rather than 0.8: the safe zone is a circle, so what has to fit is the
       group's *diagonal* half-extent (241 units), not its width. 241 x 0.74 =
       178, inside the 204-unit safe radius. -->
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="2.8" fill="#372a1d" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="#fbf8f1"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
    <rect x="76"  y="96"  width="210" height="148" rx="22" fill="#c25c2b" transform="rotate(-4 181 170)"/>
    <rect x="300" y="140" width="136" height="210" rx="22" fill="#f4c2c2" transform="rotate(4 368 245)"/>
    <rect x="100" y="282" width="176" height="134" rx="22" fill="#76b583" transform="rotate(3 188 349)"/>
  </g>
</svg>
