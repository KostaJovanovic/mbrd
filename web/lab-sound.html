<!doctype html>
<html lang="en" data-theme="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbrd — sound lab</title>
<!-- Sound bench. Not part of the app. Uses the real cuelume modules via
     assets/lab-sound.js (npm run build / npm run dev:sound). Off the design
     system on purpose (own colours, no tokens.css). Lives in web/ because the
     dev server roots there. noindex, not robots.txt Disallow. -->
<meta name="robots" content="noindex, nofollow">
<style>
:root {
  --ink: #17181b;
  --paper: #fbfbf9;
  --line: #d8d8d2;
  --faint: #7b7c80;
  --hot: #1d4ed8;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  background: var(--paper);
  color: var(--ink);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
}
h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
h2 { font-size: 12px; font-weight: 600; margin: 28px 0 8px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
p.lede { margin: 0 0 4px; max-width: 62ch; color: var(--faint); }
button {
  font: inherit;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--faint); }
button[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff; }
.strip { display: flex; flex-wrap: wrap; gap: 6px; }
#cues { display: table; border-collapse: collapse; }
#cues .row { display: table-row; }
#cues .row > * { display: table-cell; padding: 3px 8px 3px 0; vertical-align: middle; }
#cues .head > * { color: var(--faint); font-size: 11px; }
#cues .cue { width: 8ch; }
#cues button.col { width: 13ch; text-align: left; }
.pane { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.field { display: grid; grid-template-columns: 13ch 1fr 7ch; gap: 8px; align-items: center; padding: 1px 0; }
.field .name { color: var(--faint); }
.field .value { text-align: right; font-variant-numeric: tabular-nums; }
.field input { width: 100%; }
#numbers .title { font-weight: 600; padding-bottom: 6px; }
#numbers .sub { color: var(--faint); padding: 10px 0 2px; border-top: 1px solid var(--line); margin-top: 8px; }
.actions { padding-top: 12px; }
#out { white-space: pre; overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: #fff; min-height: 2em; }
</style>
</head>
<body>

<h1>sound lab</h1>
<p class="lede">Every cue and the recipe it plays, and the numbers behind them. Pinned to High; nothing here writes to a board.</p>

<h2>cues</h2>
<div id="cues"></div>

<h2>pairs, and a flurry</h2>
<div id="pairs" class="strip"></div>

<h2>recipes</h2>
<div id="recipes" class="strip"></div>

<div class="pane">
  <div>
    <h2>numbers</h2>
    <div id="numbers"></div>
    <div class="strip actions">
      <button id="play">play</button>
      <button id="flip">invert</button>
      <button id="dump">print</button>
    </div>
  </div>
  <div>
    <h2>out</h2>
    <div id="out"></div>
  </div>
</div>

<script type="module">
import { initSoundLab } from './assets/lab-sound.js';
initSoundLab();
</script>
</body>
</html>
