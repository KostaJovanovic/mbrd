<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="mbrd">
  <!-- Maskable variant: same mark, pulled into the inner 80% safe zone so a
       round or squircle OS mask can't clip the sheets. -->
  <defs>
    <pattern id="dots" width="52" height="52" patternUnits="userSpaceOnUse">
      <circle cx="26" cy="26" r="3" fill="#372a1d" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="#f7f0e1"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <g stroke="#372a1d" stroke-opacity="0.16" stroke-width="5">
      <rect x="72"  y="118" width="182" height="128" rx="22" fill="#c25c2b" transform="rotate(-4 163 182)"/>
      <rect x="278" y="160" width="150" height="196" rx="22" fill="#fbf6ea" transform="rotate(3 353 258)"/>
      <rect x="126" y="286" width="168" height="118" rx="22" fill="#75855f" transform="rotate(-2 210 345)"/>
    </g>
    <path d="M60 420c70 0 96-40 158-40 44 0 72 30 112 30s70-30 122-30"
          fill="none" stroke="#8d3c17" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
