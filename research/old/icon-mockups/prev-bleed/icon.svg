<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="mbrd">
  <!-- Two cards on the dot grid, the big one running off the edge - because the
       board does not stop, which is the first thing the README says about it.
       (Earlier icons are kept in icon-mockups/: old/ is the pre-v0.66 one,
       prev-m2/ the three-card set this replaces.)

       Built for the sizes that actually get seen. Terracotta is 4.07:1 against
       the paper ground, so the big card holds its shape down to a 16px tab; the
       absinthe card is the second reading and can afford to be quieter. Nothing
       is outlined and the thinnest feature is a 26-unit corner radius, so the
       mark degrades into two blocks of colour rather than into mush.

       Ground is paper #fbf8f1 and the big card accent terracotta #c25c2b, both
       tokens.css defaults; absinthe #76b583 is picked by hand. Dots are ink at
       16% - paper dots on a paper ground are invisible.

       The clip is what makes the bleed work: the card is drawn past 512 and cut
       by the same rounded rectangle as the ground, so the edge stays the icon's
       edge instead of the card growing its own corner. -->
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="2.8" fill="#372a1d" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#fbf8f1"/>
  <rect width="512" height="512" rx="112" fill="url(#dots)"/>
  <g clip-path="url(#sq)">
    <rect x="56"  y="72"  width="150" height="112" rx="18" fill="#76b583" transform="rotate(4 131 128)"/>
    <rect x="146" y="188" width="420" height="300" rx="26" fill="#c25c2b" transform="rotate(-6 356 338)"/>
  </g>
</svg>
