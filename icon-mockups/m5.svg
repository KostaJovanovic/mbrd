<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="mbrd">
  <!-- M5 Infinite: accent ground, one card running off the edge because the
       board does not stop. Colour-forward - stands out in a dock of white apps. -->
  <defs>
    <pattern id="d5" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="2.8" fill="#fbf8f1" fill-opacity="0.20"/>
    </pattern>
    <clipPath id="sq5"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#c25c2b"/>
  <rect width="512" height="512" rx="112" fill="url(#d5)"/>
  <g clip-path="url(#sq5)">
    <rect x="56" y="72" width="150" height="112" rx="18" fill="#2b2118" transform="rotate(4 131 128)"/>
    <rect x="146" y="188" width="420" height="300" rx="26" fill="#fbf8f1" transform="rotate(-6 356 338)"/>
  </g>
</svg>
