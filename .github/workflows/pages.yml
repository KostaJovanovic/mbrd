# A live demo on every push to main.
#
# The app is a static site with no build step, so this is a straight upload of
# web/ — the same bytes the dev server hands out. Nothing is compiled and
# nothing is minified, which means the deployed demo is also a readable copy of
# the source, which is fine and arguably the point.
#
# One-time setup: Settings → Pages → Source: GitHub Actions.
#
# Note for anyone wondering about the service worker: it treats localhost and
# LAN addresses as pass-through, so on a Pages origin it precaches SHELL
# normally, which is what we want a demo to exercise.

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
