# Build every app and publish them all to ONE release, in the public repo.
#
# MANUAL ONLY: Actions tab -> "Release apps" -> Run workflow, or
# `gh workflow run release.yml -R KostaJovanovic/mbrd`. save.bat option 1
# (`save.bat release`) runs that command after its push. A plain push never
# starts it, so an ordinary save costs nothing here. Untick "Publish the
# release" for a test build. A port of FileAnalyser's release.yml.
#
# One run builds, in parallel, each on its own GitHub machine, ONE file per
# system, and two for Linux:
#   windows  mbrd-Windows-<version>.exe         installs, or unpacks a portable
#                                               copy (desktop/installer.nsh)
#   macos    mbrd-mac-universal-<version>.dmg   Apple silicon and Intel
#   linux    mbrd-linux-x64-<version>.AppImage  runs anywhere, updates itself
#            mbrd-linux-x64-<version>.deb       Debian and Ubuntu, opens .mbrd
#   android  mbrd-android-<version>.apk         signed, with the native FFmpeg
#                                               once group N adds it
# Each build job uploads its own file STRAIGHT INTO the release, which the
# version job opened as a DRAFT before any of them started. The publish job
# then makes that draft visible, in one step, with all five files already in
# it.
#
# The draft is what makes that safe, and it is the whole design. The installed
# apps read GitHub's "latest release" endpoint, which excludes drafts - so a
# half-filled draft is invisible to every copy of the app, and the release
# appears to them all at once at the flip. The all-at-once rule that the old
# collect-then-upload shape existed to keep is kept by the draft instead.
#
# What that buys: nothing is ever written to Actions artifact storage, which
# is capped per account and counts a release set at about 1.5 GB. That cap
# filled in September and took two releases down with it - every app built,
# every upload refused, and the cleanup step of the day sat in the publish
# job, which is skipped when a build job fails, so it could never run. Release
# assets on a public repo are not metered, so there is no quota here to fill,
# no retention to tune and no cleanup step to go wrong. Do not reintroduce
# actions/upload-artifact for the apps.
#
# The version comes from web/assets/js/version.js, which save.bat stamps, through
# desktop/scripts/version.mjs (0.301 -> 0.301.0). The release, the installers
# and the app's own footer agree. A second run on the same version uploads into
# the same release again, with --clobber, whether it is still a draft or
# already published.
#
# The releases live in KostaJovanovic/mbrd-release, not here. This repo is
# private, and GitHub answers a private repo's releases with a 404 to anybody
# signed out, so Get the app and the updaters would find nothing. See
# research/old/apps-2026-09-13.md §4.4.
#
# There is no update file in the release. The apps ask GitHub's API for the
# latest release (desktop/updates.ts), and the answer gives every file's
# download URL and the SHA-256 digest GitHub computed for it. The apps find
# their file by the part of the name before the version, so keep that part -
# "mbrd-Windows", "mbrd-linux-x64" - exactly as it is.
#
# Secrets, set by the maintainer:
#   RELEASES_TOKEN  a fine-grained token for KostaJovanovic/mbrd-release only,
#                   Contents read and write. The job's own GITHUB_TOKEN cannot
#                   write to another repo. Every job that touches the release
#                   reads it now - the builds upload with it - where before
#                   only publish did. It can write nothing in this repo.
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64
#   ANDROID_KEYSTORE_PASSWORD  its password, also used for the key...
#   ANDROID_KEY_PASSWORD       ...unless this optional one is set
#   ANDROID_KEY_ALIAS          the key alias
# The steps for the key are in mobile/README.md. Keep the SAME keystore
# forever: Android refuses an update signed with another key.
name: Release apps

on:
  workflow_dispatch:
    inputs:
      # Untick for a test build. The draft is still filled with all five real
      # files, and stays a draft - so you can download and try them, and no
      # installed app sees an update. Tick it on a later run of the same
      # version to publish that draft.
      publish:
        description: Publish the release
        type: boolean
        default: true
      # A macOS minute bills at ten times a Linux one and a Windows minute at
      # twice, so the two systems the maintainer does not run cost more than
      # the two he does. "windows-android" starts no macOS or Linux runner at
      # all - it is the matrix that is short, not the jobs that skip - and the
      # release then carries two files and says so.
      #
      # It defaults to `all` on purpose, against the usual flow: save.bat
      # always passes this explicitly, so the default is only ever reached by
      # a hand-started run from the Actions tab, and there the costly mistake
      # is publishing an incomplete release, not spending four minutes.
      systems:
        description: Which systems to build
        type: choice
        default: all
        options:
          - all
          - windows-android

# Two runs at once would race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

# Write, for the one thing this repo gets: the v<version> tag on the source
# commit. The release itself is written with RELEASES_TOKEN.
permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    # contents: read is all the checkout needs. The release is written in the
    # other repo, with RELEASES_TOKEN, which this grant has no say over.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
      desktop: ${{ steps.m.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the version
        id: v
        run: |
          node desktop/scripts/version.mjs >> "$GITHUB_OUTPUT"
          node desktop/scripts/version.mjs
      # No install first: the suite needs none, which ci.yml also holds.
      - name: Test
        run: npm test

      # The desktop matrix, decided here rather than in the job, because a
      # matrix that never lists macOS starts no macOS runner - which is the
      # whole saving. A job-level `if` would start one and bill for it.
      # Android is not in here: it builds every time, on the Linux rate.
      - name: Which systems build
        id: m
        env:
          SYSTEMS: ${{ inputs.systems }}
        run: |
          set -euo pipefail
          win='{"name":"windows","os":"windows-latest","platform":"win32","target":"--win","asar":"out/win-unpacked/resources/app.asar"}'
          mac='{"name":"macos","os":"macos-latest","platform":"darwin","target":"--mac","asar":"out/mac-universal/mbrd.app/Contents/Resources/app.asar"}'
          lin='{"name":"linux","os":"ubuntu-24.04","platform":"linux","target":"--linux","asar":"out/linux-unpacked/resources/app.asar"}'
          if [ "$SYSTEMS" = "all" ]; then
            echo "desktop=[$win,$mac,$lin]" >> "$GITHUB_OUTPUT"
            echo "building Windows, macOS and Linux, and Android"
          else
            echo "desktop=[$win]" >> "$GITHUB_OUTPUT"
            echo "::notice title=Two systems only::Building Windows and Android. The release will carry two files, and macOS and Linux copies will see a version they cannot download until the next full release."
          fi

      # The place the build jobs upload into, opened before any of them start.
      # A draft is invisible: it is absent from the releases page and from the
      # "latest release" endpoint the updaters read, so it can sit here half
      # filled, or half filled and abandoned, without any installed app seeing
      # it. Notes are written at the flip, not here, so they live in one place.
      #
      # An existing release of this version is left exactly as it is, draft or
      # published. Re-running a release must not withdraw one that is already
      # out: --clobber replaces the files in place, and publish sets it latest
      # again at the end.
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          LABEL: ${{ steps.v.outputs.label }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=No RELEASES_TOKEN::Set the RELEASES_TOKEN secret: a fine-grained token for KostaJovanovic/mbrd-release only, Contents read and write. gh secret set RELEASES_TOKEN -R KostaJovanovic/mbrd"
            exit 1
          fi
          repo=KostaJovanovic/mbrd-release
          tag="v$VERSION"
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" -R "$repo" --json isDraft --jq '.isDraft')" = "true" ]; then
              echo "$tag is there as a draft, filling it again"
            else
              # The one case with no cover: the files are replaced one at a
              # time in a release the apps can already see. Stamp a new
              # version instead, which save.bat does on every save.
              echo "::warning title=Already published::$tag is out. Its files will be replaced while it is visible, and an updater reading it mid-run can see a version it cannot download."
            fi
          else
            # --target main, not the source commit: a tag here must name a
            # commit in this repo, and the source commit is not in it. A draft
            # creates no tag until it is published.
            gh release create "$tag" -R "$repo" --draft --title "mbrd $LABEL" --notes "Building." --target main
            echo "opened $tag as a draft"
          fi

  desktop:
    needs: version
    strategy:
      # One system failing leaves the others to finish, so "Re-run failed
      # jobs" is enough to recover.
      fail-fast: false
      matrix:
        # Written by the version job's "Which systems build" step, which is
        # where the three entries now live. One name per row: windows, macos,
        # linux, with os, platform, target and asar on each.
        include: ${{ fromJSON(needs.version.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # bash on all three runners, which GitHub provides on Windows too.
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The web bundle, which is what the shell serves.
      - name: Build the app
        working-directory: .
        run: |
          npm ci
          npm run build

      - run: npm ci

      # 80-odd megabytes per system, fetched rather than committed. See the
      # script's header.
      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.platform }}

      # desktop/ is outside the root tsconfig on purpose. This leg reads it.
      - name: Typecheck the shell
        run: npm run typecheck

      # Launch, add a note, close, relaunch, and see the board come back, before
      # 200 MB of installer is wrapped round it. Linux runners have no display.
      # A minute a test here, not the three the config allows a slow machine:
      # a hang then fails in about 12 minutes, and a private repo pays ten
      # times the Linux rate for a macOS minute.
      - name: Smoke test
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run --auto-servernum npm run smoke -- --timeout=60000
          else
            npm run smoke -- --timeout=60000
          fi

      # The app's own log from each smoke run, which says where a hang stopped.
      # A hung test never reaches its cleanup, so its folder is still there.
      - name: The smoke test's app logs
        if: failure()
        run: >-
          node -e "const fs = require('fs'), path = require('path'), dir = require('os').tmpdir();
          for (const name of fs.readdirSync(dir).filter(n => n.startsWith('mbrd-smoke-'))) {
          const file = path.join(dir, name, 'logs', 'main.log');
          if (fs.existsSync(file)) console.log('== ' + file + '\n' + fs.readFileSync(file, 'utf8')); }"

      # npm installed sharp's native package for this runner's chip only, and
      # the universal app needs the Intel one too. x64ArchFiles in
      # electron-builder.yml lets the pair sit in both halves. The versions are
      # the ones sharp itself names.
      - name: Add sharp for Intel Macs
        if: matrix.platform == 'darwin'
        run: |
          v=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-darwin-x64']")
          l=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-libvips-darwin-x64']")
          npm install --no-save --force --ignore-scripts "@img/sharp-darwin-x64@$v" "@img/sharp-libvips-darwin-x64@$l"
          ls node_modules/@img

      - name: Build
        env:
          # No Apple certificate: electron-builder.yml sets mac.identity to null
          # and scripts/after-pack.cjs signs ad-hoc. This stops the keychain search.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Three tries, because electron-builder fetches Electron and the NSIS
        # kit from GitHub mid-build, and one 504 there failed v0.448. What it
        # already fetched stays in its cache, so a retry repeats only the rest.
        run: |
          for try in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never "-c.extraMetadata.version=${{ needs.version.outputs.version }}" && exit 0
            echo "::warning title=Build retried::electron-builder failed on try $try"
            sleep 30
          done
          exit 1

      # FileAnalyser 9.8 shipped with no title bar: its chrome pages were not in
      # the package. Here they are built into dist/chrome/, which files: ships
      # with dist/**, and this looks inside the packed archive to be sure.
      # asar lists with backslashes on Windows, hence [\\/].
      - name: The title bar is in the package
        run: |
          if ! npx asar list "${{ matrix.asar }}" | grep -qE '[\\/]dist[\\/]chrome[\\/]titlebar\.html$'; then
            echo "::error title=No title bar::${{ matrix.asar }} has no dist/chrome/titlebar.html. This is the FileAnalyser 9.8 fault: the app would open with no title bar. Check scripts/build.mjs and files: in electron-builder.yml."
            exit 1
          fi

      # Straight into the draft, not into artifact storage. The files per
      # system, by extension: nothing else in out/ ships. nullglob so an
      # extension this system does not build expands to nothing rather than to
      # its own pattern, and the empty check is then the real one - it is what
      # if-no-files-found: error used to be.
      - name: Upload into the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/mbrd-*.exe out/mbrd-*.dmg out/mbrd-*.AppImage out/mbrd-*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error title=Nothing built::electron-builder left no installer in desktop/out for ${{ matrix.name }}."
            exit 1
          fi
          ls -l "${files[@]}"
          gh release upload "v$VERSION" "${files[@]}" -R KostaJovanovic/mbrd-release --clobber

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Gradle needs JDK 21 for Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The web bundle, which is what the APK carries. Built here, as the
      # desktop job builds it, and not only for that: stage-web.mjs refuses a
      # bundle older than its sources, and a fresh checkout writes app.js
      # before every .ts under it.
      - name: Build the app
        run: |
          npm ci
          npm run build

      # The FFmpeg executable takes about 4 minutes on FileAnalyser's runs, so
      # it is cached on the build script and rebuilds only when that script
      # changes. The script arrives in group N of
      # research/old/apps-tasks-2026-09-13.md, and until then these four steps
      # skip and the APK runs ffmpeg.wasm, as the website does.
      - name: Restore FFmpeg
        id: ffcache
        if: hashFiles('mobile/ffmpeg/build-android.sh') != ''
        uses: actions/cache/restore@v4
        with:
          path: mobile/ffmpeg/out
          key: android-ffmpeg-${{ hashFiles('mobile/ffmpeg/build-android.sh') }}
      - name: Build FFmpeg
        id: ffbuild
        if: hashFiles('mobile/ffmpeg/build-android.sh') != '' && steps.ffcache.outputs.cache-hit != 'true'
        # A failed FFmpeg build must not block the release. The APK then runs
        # ffmpeg.wasm, as the website does, and the next step says so.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config meson ninja-build xz-utils
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash mobile/ffmpeg/build-android.sh
      - name: Save FFmpeg
        if: steps.ffbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: mobile/ffmpeg/out
          key: ${{ steps.ffcache.outputs.cache-primary-key }}
      - name: Report a missing FFmpeg
        if: steps.ffbuild.outcome == 'failure'
        run: echo "::warning title=No native FFmpeg::The FFmpeg build failed, so this APK uses ffmpeg.wasm. Read the Build FFmpeg step."

      - name: Stage the site and sync the project
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=No keystore::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets on KostaJovanovic/mbrd. See mobile/README.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MBRD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the APK
        working-directory: mobile/android
        env:
          MBRD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MBRD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MBRD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # -PmbrdUpdateFeed turns the updater on (MbrdUpdate.java): the GitHub
        # API answer for the latest release in the public repo. Written out,
        # because github.repository is this private one. Only this build
        # passes it, so a mobile.bat build never checks for updates.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PmbrdUpdateFeed=https://api.github.com/repos/KostaJovanovic/mbrd-release/releases/latest

      # The updater finds the APK by the part of the name before the version
      # (APK_NAME in MbrdUpdate.java). tests/desktop-package.test.js holds the two.
      - name: Name the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/mbrd-android-$VERSION.apk"
      - name: Upload into the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" "out/mbrd-android-$VERSION.apk" -R KostaJovanovic/mbrd-release --clobber

  publish:
    needs: [version, desktop, android]
    # Off for a test build: the draft keeps the files and stays invisible.
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    # contents for the source tag below, the one thing written in this repo.
    permissions:
      contents: write
    steps:
      # The five names are a contract - the updaters find their file by the
      # part before the version (desktop/updates.ts, MbrdUpdate.java), and
      # tests/desktop-package.test.js holds the patterns against it. Checked
      # here, on the draft, because this is the last moment they are still
      # invisible. A missing one published is an app that cannot update; a
      # missing one caught here is a re-run.
      #
      # No source zip: the maintainer owns mbrd's own code, and the GPL FFmpeg
      # and LGPL OCCT sources are offered by the upstream pages that
      # .github/THIRD-PARTY.md names.
      - name: Every app is in the draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          SYSTEMS: ${{ inputs.systems }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          want=("mbrd-Windows-$VERSION.exe" "mbrd-android-$VERSION.apk")
          if [ "$SYSTEMS" = "all" ]; then
            want+=("mbrd-mac-universal-$VERSION.dmg" \
                   "mbrd-linux-x64-$VERSION.AppImage" \
                   "mbrd-linux-x64-$VERSION.deb")
          fi
          have=$(gh release view "$tag" -R KostaJovanovic/mbrd-release --json assets --jq '.assets[].name')
          echo "$have"
          missing=0
          for name in "${want[@]}"; do
            if ! echo "$have" | grep -qxF "$name"; then
              echo "::error title=Missing app::$name is not in the draft $tag. Re-run the job that builds it; the draft keeps what is already there."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          LABEL: ${{ needs.version.outputs.label }}
          SYSTEMS: ${{ inputs.systems }}
        run: |
          set -euo pipefail
          repo=KostaJovanovic/mbrd-release
          tag="v$VERSION"
          dl="https://github.com/$repo/releases/download/$tag"
          # Only the files that are actually in the release get a row. A table
          # offering four downloads where two answer 404 is worse than a table
          # that says which two systems this one is for - and a macOS copy is
          # sent to this page by its own update check, so it is read.
          cat > notes.md <<EOF
          Every mbrd app, in one place. Pick the file for your system.

          | System | Download | Updates |
          |---|---|---|
          | Windows | [mbrd-Windows-$VERSION.exe]($dl/mbrd-Windows-$VERSION.exe) | Installs itself. A portable copy tells you |
          EOF
          if [ "$SYSTEMS" = "all" ]; then
            cat >> notes.md <<EOF
          | macOS, Apple silicon and Intel | [mbrd-mac-universal-$VERSION.dmg]($dl/mbrd-mac-universal-$VERSION.dmg) | Tells you |
          | Linux | [mbrd-linux-x64-$VERSION.AppImage]($dl/mbrd-linux-x64-$VERSION.AppImage) | Installs itself |
          | Linux, Debian and Ubuntu | [mbrd-linux-x64-$VERSION.deb]($dl/mbrd-linux-x64-$VERSION.deb) | Tells you |
          EOF
          fi
          cat >> notes.md <<EOF
          | Android 7 and later | [mbrd-android-$VERSION.apk]($dl/mbrd-android-$VERSION.apk) | Asks, then installs |

          EOF
          if [ "$SYSTEMS" != "all" ]; then
            cat >> notes.md <<EOF
          **This release is Windows and Android only.** If mbrd on macOS or Linux told you $VERSION is out, it is not there for your system - stay on the version you have, and the next release that carries all four will update you straight to it.

          EOF
          fi
          if [ "$SYSTEMS" = "all" ]; then
            echo "The macOS, Linux and Android builds are new and less tested than the Windows one." >> notes.md
          else
            echo "The Android build is new and less tested than the Windows one." >> notes.md
          fi
          cat >> notes.md <<EOF

          No build carries a paid signing certificate yet, so each system asks once:

          - **Windows:** SmartScreen stops the first run. Click **More info**, then **Run anyway**.
          EOF
          if [ "$SYSTEMS" = "all" ]; then
            cat >> notes.md <<EOF
          - **macOS:** open the app once and close the warning. Then open **System Settings > Privacy & Security** and click **Open Anyway**. On macOS 15 and later the old right-click, Open trick no longer works. If Finder says the app is damaged, it is not: run xattr -d com.apple.quarantine /Applications/mbrd.app in Terminal, then open it normally.
          - **Linux:** make the AppImage executable with chmod +x, then run it. Or install the .deb with sudo apt install ./mbrd-linux-x64-$VERSION.deb, and .mbrd files open on a double-click.
          EOF
          fi
          cat >> notes.md <<EOF
          - **Android:** when Android asks, allow your browser or file manager to install apps.

          Built from commit $GITHUB_SHA.
          EOF
          cat notes.md
          # The whole publication, in one call: the five files are already in
          # the draft and the step above has counted them. --draft=false is
          # what makes them visible, and it is the first moment any installed
          # app can see this version. Harmless on a release that is already
          # out, which is what a second run on the same version reaches.
          gh release edit "$tag" -R "$repo" \
            --title "mbrd $LABEL" --notes-file notes.md --draft=false --latest

      # The tag that ties the release to its source, in this repo, with the
      # job's own token.
      - name: Tag the source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists here, left as it is"
          else
            gh api "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
