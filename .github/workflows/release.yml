# Build every app and publish them all to ONE release, in the public repo.
#
# MANUAL ONLY: Actions tab -> "Release apps" -> Run workflow, or
# `gh workflow run release.yml -R KostaJovanovic/mbrd`. save.bat option 1
# (`save.bat release`) runs that command after its push. A plain push never
# starts it, so an ordinary save costs nothing here. Untick "Publish the
# release" for a test build. A port of FileAnalyser's release.yml.
#
# One run builds, in parallel, each on its own GitHub machine, ONE file per
# system, and two for Linux:
#   windows  mbrd-Windows-<version>.exe         installs, or unpacks a portable
#                                               copy (desktop/installer.nsh)
#   macos    mbrd-mac-universal-<version>.dmg   Apple silicon and Intel
#   linux    mbrd-linux-x64-<version>.AppImage  runs anywhere, updates itself
#            mbrd-linux-x64-<version>.deb       Debian and Ubuntu, opens .mbrd
#   android  mbrd-android-<version>.apk         signed, with the native FFmpeg
#                                               once group N adds it
# Then the publish job creates the release v<version> with all of them at
# once. All at once on purpose: the installed apps read the
# latest release, and a half-uploaded one would point them at a file that is
# not there yet.
#
# The version comes from web/assets/js/version.js, which save.bat stamps, through
# desktop/scripts/version.mjs (0.301 -> 0.301.0). The release, the installers
# and the app's own footer agree. A second run on the same commit uploads into
# the same release again.
#
# The releases live in KostaJovanovic/mbrd-release, not here. This repo is
# private, and GitHub answers a private repo's releases with a 404 to anybody
# signed out, so Get the app and the updaters would find nothing. See
# research/old/apps-2026-09-13.md §4.4.
#
# There is no update file in the release. The apps ask GitHub's API for the
# latest release (desktop/updates.ts), and the answer gives every file's
# download URL and the SHA-256 digest GitHub computed for it. The apps find
# their file by the part of the name before the version, so keep that part -
# "mbrd-Windows", "mbrd-linux-x64" - exactly as it is.
#
# Secrets, set by the maintainer:
#   RELEASES_TOKEN  a fine-grained token for KostaJovanovic/mbrd-release only,
#                   Contents read and write. The job's own GITHUB_TOKEN cannot
#                   write to another repo. Only the publish job reads it.
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64
#   ANDROID_KEYSTORE_PASSWORD  its password, also used for the key...
#   ANDROID_KEY_PASSWORD       ...unless this optional one is set
#   ANDROID_KEY_ALIAS          the key alias
# The steps for the key are in mobile/README.md. Keep the SAME keystore
# forever: Android refuses an update signed with another key.
name: Release apps

on:
  workflow_dispatch:
    inputs:
      # Untick for a test build. Every file still lands on the run page as an
      # artifact, but no release appears, so no installed app sees an update.
      publish:
        description: Publish the release
        type: boolean
        default: true

# Two runs at once would race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

# Write, for the one thing this repo gets: the v<version> tag on the source
# commit. The release itself is written with RELEASES_TOKEN.
permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    # actions: write for the prune below, which the top-level block does not
    # grant; contents: read is all the checkout needs.
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      # Artifact storage is counted across the whole account and one release is
      # about 1.5 GB, so only one set may be live at a time. This runs BEFORE
      # the builds on purpose. A prune that runs after them cannot recover the
      # state it exists to prevent: storage full -> every upload fails -> the
      # build jobs fail -> publish is skipped -> the prune never runs, and the
      # next release finds the storage just as full. That deadlock cost the
      # v0.422 and v0.423 releases, with nothing wrong in either build.
      #
      # Every OTHER run's artifacts, not the last two: at 1.5 GB a set, two
      # kept sets plus this one is already over the quota. Nothing is lost by
      # it - re-running a previous run's publish by hand re-runs no job here,
      # and retention-days: 1 on each upload would have taken them within a day
      # anyway. It is this run's own set that publish needs, and this step
      # cannot see it yet.
      - name: Make room for this run's apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired == false) | "\(.workflow_run.id) \(.id) \(.name) \(.size_in_bytes)"' \
            | while read -r run id name size; do
            if [ "$run" = "$RUN" ]; then
              echo "keep  $name ($run)"
            else
              echo "drop  $name ($run, $size bytes)"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null
            fi
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the version
        id: v
        run: |
          node desktop/scripts/version.mjs >> "$GITHUB_OUTPUT"
          node desktop/scripts/version.mjs
      # No install first: the suite needs none, which ci.yml also holds.
      - name: Test
        run: npm test

  desktop:
    needs: version
    strategy:
      # One system failing leaves the others to finish, so "Re-run failed
      # jobs" is enough to recover.
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: win32
            target: --win
            asar: out/win-unpacked/resources/app.asar
          - name: macos
            os: macos-latest
            platform: darwin
            target: --mac
            asar: out/mac-universal/mbrd.app/Contents/Resources/app.asar
          - name: linux
            os: ubuntu-24.04
            platform: linux
            target: --linux
            asar: out/linux-unpacked/resources/app.asar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # bash on all three runners, which GitHub provides on Windows too.
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The web bundle, which is what the shell serves.
      - name: Build the app
        working-directory: .
        run: |
          npm ci
          npm run build

      - run: npm ci

      # 80-odd megabytes per system, fetched rather than committed. See the
      # script's header.
      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.platform }}

      # desktop/ is outside the root tsconfig on purpose. This leg reads it.
      - name: Typecheck the shell
        run: npm run typecheck

      # Launch, add a note, close, relaunch, and see the board come back, before
      # 200 MB of installer is wrapped round it. Linux runners have no display.
      # A minute a test here, not the three the config allows a slow machine:
      # a hang then fails in about 12 minutes, and a private repo pays ten
      # times the Linux rate for a macOS minute.
      - name: Smoke test
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run --auto-servernum npm run smoke -- --timeout=60000
          else
            npm run smoke -- --timeout=60000
          fi

      # The app's own log from each smoke run, which says where a hang stopped.
      # A hung test never reaches its cleanup, so its folder is still there.
      - name: The smoke test's app logs
        if: failure()
        run: >-
          node -e "const fs = require('fs'), path = require('path'), dir = require('os').tmpdir();
          for (const name of fs.readdirSync(dir).filter(n => n.startsWith('mbrd-smoke-'))) {
          const file = path.join(dir, name, 'logs', 'main.log');
          if (fs.existsSync(file)) console.log('== ' + file + '\n' + fs.readFileSync(file, 'utf8')); }"

      # npm installed sharp's native package for this runner's chip only, and
      # the universal app needs the Intel one too. x64ArchFiles in
      # electron-builder.yml lets the pair sit in both halves. The versions are
      # the ones sharp itself names.
      - name: Add sharp for Intel Macs
        if: matrix.platform == 'darwin'
        run: |
          v=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-darwin-x64']")
          l=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-libvips-darwin-x64']")
          npm install --no-save --force --ignore-scripts "@img/sharp-darwin-x64@$v" "@img/sharp-libvips-darwin-x64@$l"
          ls node_modules/@img

      - name: Build
        env:
          # No Apple certificate: electron-builder.yml sets mac.identity to null
          # and scripts/after-pack.cjs signs ad-hoc. This stops the keychain search.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish never "-c.extraMetadata.version=${{ needs.version.outputs.version }}"

      # FileAnalyser 9.8 shipped with no title bar: its chrome pages were not in
      # the package. Here they are built into dist/chrome/, which files: ships
      # with dist/**, and this looks inside the packed archive to be sure.
      # asar lists with backslashes on Windows, hence [\\/].
      - name: The title bar is in the package
        run: |
          if ! npx asar list "${{ matrix.asar }}" | grep -qE '[\\/]dist[\\/]chrome[\\/]titlebar\.html$'; then
            echo "::error title=No title bar::${{ matrix.asar }} has no dist/chrome/titlebar.html. This is the FileAnalyser 9.8 fault: the app would open with no title bar. Check scripts/build.mjs and files: in electron-builder.yml."
            exit 1
          fi

      # The files per system, by extension: nothing else in out/ ships.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            desktop/out/mbrd-*.exe
            desktop/out/mbrd-*.dmg
            desktop/out/mbrd-*.AppImage
            desktop/out/mbrd-*.deb
          if-no-files-found: error
          # Installers and disk images are compressed already.
          compression-level: 0
          # These live only long enough for publish to collect them, minutes
          # later. The default is 90 days, and four apps a release at about
          # 1.5 GB a time filled the account's artifact storage: every build
          # after that failed on the upload, with the apps built and the
          # release never published. One day is the shortest GitHub accepts.
          retention-days: 1

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Gradle needs JDK 21 for Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The web bundle, which is what the APK carries. Built here, as the
      # desktop job builds it, and not only for that: stage-web.mjs refuses a
      # bundle older than its sources, and a fresh checkout writes app.js
      # before every .ts under it.
      - name: Build the app
        run: |
          npm ci
          npm run build

      # The FFmpeg executable takes about 4 minutes on FileAnalyser's runs, so
      # it is cached on the build script and rebuilds only when that script
      # changes. The script arrives in group N of
      # research/old/apps-tasks-2026-09-13.md, and until then these four steps
      # skip and the APK runs ffmpeg.wasm, as the website does.
      - name: Restore FFmpeg
        id: ffcache
        if: hashFiles('mobile/ffmpeg/build-android.sh') != ''
        uses: actions/cache/restore@v4
        with:
          path: mobile/ffmpeg/out
          key: android-ffmpeg-${{ hashFiles('mobile/ffmpeg/build-android.sh') }}
      - name: Build FFmpeg
        id: ffbuild
        if: hashFiles('mobile/ffmpeg/build-android.sh') != '' && steps.ffcache.outputs.cache-hit != 'true'
        # A failed FFmpeg build must not block the release. The APK then runs
        # ffmpeg.wasm, as the website does, and the next step says so.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config meson ninja-build xz-utils
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash mobile/ffmpeg/build-android.sh
      - name: Save FFmpeg
        if: steps.ffbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: mobile/ffmpeg/out
          key: ${{ steps.ffcache.outputs.cache-primary-key }}
      - name: Report a missing FFmpeg
        if: steps.ffbuild.outcome == 'failure'
        run: echo "::warning title=No native FFmpeg::The FFmpeg build failed, so this APK uses ffmpeg.wasm. Read the Build FFmpeg step."

      - name: Stage the site and sync the project
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=No keystore::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets on KostaJovanovic/mbrd. See mobile/README.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MBRD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the APK
        working-directory: mobile/android
        env:
          MBRD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MBRD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MBRD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # -PmbrdUpdateFeed turns the updater on (MbrdUpdate.java): the GitHub
        # API answer for the latest release in the public repo. Written out,
        # because github.repository is this private one. Only this build
        # passes it, so a mobile.bat build never checks for updates.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PmbrdUpdateFeed=https://api.github.com/repos/KostaJovanovic/mbrd-release/releases/latest

      # The updater finds the APK by the part of the name before the version
      # (APK_NAME in MbrdUpdate.java). tests/desktop-package.test.js holds the two.
      - name: Name the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/mbrd-android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/mbrd-android-*.apk
          if-no-files-found: error
          compression-level: 0
          # Thrown away a day later - see the desktop upload above.
          retention-days: 1

  publish:
    needs: [version, desktop, android]
    # Off for a test build: the files stay on the run page only.
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    # contents for the source tag below. The artifacts are pruned by the
    # version job, before the builds, which is the only place a prune survives
    # a failed upload - see its comment.
    permissions:
      contents: write
    steps:
      - name: Check for the token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error title=No RELEASES_TOKEN::Set the RELEASES_TOKEN secret: a fine-grained token for KostaJovanovic/mbrd-release only, Contents read and write. gh secret set RELEASES_TOKEN -R KostaJovanovic/mbrd"
            exit 1
          fi

      # No source zip: the maintainer owns mbrd's own code, and the GPL FFmpeg
      # and LGPL OCCT sources are offered by the upstream pages that
      # .github/THIRD-PARTY.md names.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          set -euo pipefail
          repo=KostaJovanovic/mbrd-release
          tag="v$VERSION"
          dl="https://github.com/$repo/releases/download/$tag"
          ls -l files
          cat > notes.md <<EOF
          Every mbrd app, in one place. Pick the file for your system.

          | System | Download | Updates |
          |---|---|---|
          | Windows | [mbrd-Windows-$VERSION.exe]($dl/mbrd-Windows-$VERSION.exe) | Installs itself. A portable copy tells you |
          | macOS, Apple silicon and Intel | [mbrd-mac-universal-$VERSION.dmg]($dl/mbrd-mac-universal-$VERSION.dmg) | Tells you |
          | Linux | [mbrd-linux-x64-$VERSION.AppImage]($dl/mbrd-linux-x64-$VERSION.AppImage) | Installs itself |
          | Linux, Debian and Ubuntu | [mbrd-linux-x64-$VERSION.deb]($dl/mbrd-linux-x64-$VERSION.deb) | Tells you |
          | Android 7 and later | [mbrd-android-$VERSION.apk]($dl/mbrd-android-$VERSION.apk) | Asks, then installs |

          The macOS, Linux and Android builds are new and less tested than the Windows one.

          No build carries a paid signing certificate yet, so each system asks once:

          - **Windows:** SmartScreen stops the first run. Click **More info**, then **Run anyway**.
          - **macOS:** open the app once and close the warning. Then open **System Settings > Privacy & Security** and click **Open Anyway**. On macOS 15 and later the old right-click, Open trick no longer works. If Finder says the app is damaged, it is not: run xattr -d com.apple.quarantine /Applications/mbrd.app in Terminal, then open it normally.
          - **Linux:** make the AppImage executable with chmod +x, then run it. Or install the .deb with sudo apt install ./mbrd-linux-x64-$VERSION.deb, and .mbrd files open on a double-click.
          - **Android:** when Android asks, allow your browser or file manager to install apps.

          Built from commit $GITHUB_SHA.
          EOF
          # --target main, not the source commit: a tag here must name a commit
          # in this repo, and the source commit is not in it.
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" files/* -R "$repo" --clobber
            gh release edit "$tag" -R "$repo" --notes-file notes.md --latest
          else
            gh release create "$tag" files/* -R "$repo" --title "mbrd $LABEL" --notes-file notes.md --target main --latest
          fi

      # The tag that ties the release to its source, in this repo, with the
      # job's own token.
      - name: Tag the source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists here, left as it is"
          else
            gh api "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
