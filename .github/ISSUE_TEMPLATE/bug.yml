name: Bug report
description: Something on the board does not behave the way it should.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The two things that make a canvas bug
        fixable are **the exact steps** and **a board that reproduces it** —
        everything else is guessable.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Drop three photos onto an empty board
        2. Select all, then drag from the middle one
        3. The selection moves but the threads stay behind
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 141 / Safari 18.5 / Chrome 139
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and device
      placeholder: Windows 11 / macOS 15 on M2 / iPhone 14, iOS 18
    validations:
      required: true

  - type: dropdown
    id: layout
    attributes:
      label: Which layout
      description: Desktop and Mobile share items and differ in everything spatial, so this narrows it a lot.
      options:
        - Desktop
        - Mobile
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console
      description: Anything red, pasted verbatim. Blank is a useful answer too.
      render: text

  - type: textarea
    id: board
    attributes:
      label: A board that reproduces it
      description: |
        Export a `.mbrd` (`Ctrl`+`Shift`+`S`) and drag it in here. GitHub will
        not accept the extension directly — rename it to `.zip`, which it
        already is.

        Please strip anything you would not want public: a board carries the
        embedded bytes of everything on it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked this against the latest `main`
        - label: I searched existing issues
