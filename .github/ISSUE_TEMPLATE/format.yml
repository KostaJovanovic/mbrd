name: Support a file format
description: A kind of file the board should be able to show properly.
labels: ['enhancement', 'format']
body:
  - type: markdown
    attributes:
      value: |
        This is the most natural contribution to mbrd and has its own template
        because the answer is nearly always the same shape: **a few hundred
        lines of header reading, no dependency.** `mesh.js` reads STL, OBJ and
        GLB by hand; `import/artwork.js` walks ID3v2 frames, MP4 atoms and FLAC
        blocks; `storage/zip.js` inflates its own entries. A new format joins
        them rather than arriving as an npm package.

        Where it lands: a branch in `classify()` plus an entry in `RENDERERS`,
        both in `canvas/renderers.js`. Nothing else needs to change.

  - type: input
    id: format
    attributes:
      label: The format
      placeholder: PDF / PSD / HEIC / 7z / DXF
    validations:
      required: true

  - type: textarea
    id: appearance
    attributes:
      label: What should a card of one look like?
      description: |
        A thumbnail of page one? A cover with the page count? A first frame? An
        icon with the metadata read out of it? The renderer's job is to decide
        what is worth seeing at a glance.
    validations:
      required: true

  - type: dropdown
    id: decoder
    attributes:
      label: Can the browser already decode it?
      description: |
        This is the whole question. Formats the browser decodes natively are
        cheap; formats needing a decoder are the reason PDF and PSD are still
        open.
      options:
        - Yes — the browser renders it natively
        - Partly — the header is readable by hand, the content is not
        - "No — it would need a decoder written from scratch"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: Where the format is documented
      description: A link to the spec, or to whichever notes on the layout you found readable.

  - type: textarea
    id: sample
    attributes:
      label: A sample file
      description: |
        Rename it to `.zip` if GitHub refuses the extension. Please make sure
        you are allowed to share whatever you attach.
