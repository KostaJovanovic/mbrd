# What ships, and on what terms.
#
# One artefact per platform, chosen so a person downloading this has exactly one
# link to press: a Setup.exe that asks Install or Portable on its first page, a
# universal DMG, an AppImage that runs on every distribution. deb, rpm and
# Flatpak are follow-ons - see research/electron-2026-09-06.md §10.

appId: com.valjdakosta.mbrd
productName: mbrd
copyright: © Kosta Jovanović. GPL-3.0-or-later.

directories:
  output: out
  buildResources: icons

# The two halves of the app, and nothing else.
#
# `dist/**` is the shell's two bundles. `../web/**` is the app itself, served
# over app:// by the protocol handler - which is why the source .ts files come
# with it: they are what the deployed site serves beside the bundle, and the
# same handler serves the same tree here.
#
# The exclusions are the things web/ carries that a desktop build has no use
# for. The two benches are debug harnesses (see CLAUDE.md); sw.js is the web's
# updater and is never registered here; the source map is 2.9 MB that is not
# even committed. `_headers` is NOT excluded and must not be: the protocol
# handler reads it for the CSP, which is the whole reason there is one policy
# rather than two.
#
# `icons/` joins them because main.ts reads one at runtime for the window's own
# icon - the taskbar button and the Alt-Tab card, which are not the executable's
# icon and are not set by anything below. The two files it can ask for and no
# more: the .icns is the macOS bundle's, electron-builder places it there
# itself, and 83 KB of it inside the asar would never be opened.
files:
  - dist/**
  - icons/icon.ico
  - icons/icon.png

# Beside the app rather than inside the asar, and every one of these is read by
# something that is not Node.
#
# `web/` is served over app:// by the protocol handler, which resolves it
# relative to app.getAppPath() - and in a packaged build that is
# `resources/app.asar`, so `resources/web` is what `../web` finds. It was
# `extraFiles` first, which puts it beside the executable one level further up,
# and the app booted to a 404 on its own index.html. ffmpeg is executed and
# onnxruntime reads the model by path; a file inside an asar is neither.
#
# `_headers` is in the copy and must stay: the protocol handler reads it for the
# CSP, which is the whole reason there is one policy rather than two. The
# exclusions are the things web/ carries that a desktop build has no use for -
# the two benches are debug harnesses (CLAUDE.md), sw.js is the web's updater
# and is never registered here, and the source map is not even committed.
# Beside the app rather than inside the asar, because both are read by something
# that is not Node: ffmpeg is executed, and onnxruntime reads the model by path.
# A file inside an asar has neither.
extraResources:
  - from: ../web
    to: web
    filter:
      - '**/*'
      - '!lab*.html'
      - '!assets/lab-*.js'
      - '!assets/app.js.map'
      - '!sw.js'
  - from: resources/ffmpeg
    to: ffmpeg
    filter: ['**/*']
  - from: ../web/assets/vendor/u2netp
    to: u2netp
    filter: ['*.onnx']

# The native modules keep their .node binaries outside the archive. Without
# this they cannot be dlopen'd - electron-builder detects most of these on its
# own, and naming them is what stops that detection being the thing that breaks.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/onnxruntime-node/**'

win:
  # x64 named, because installer.nsh's portable section unpacks the x64
  # package and stops the build when there is none.
  target:
    - target: nsis
      arch: [x64]
  icon: icons/icon.ico
  # Unsigned for now, and the download page has to say so - see plan §1. The
  # layout leaves signing a config change: a certificateFile and a password in
  # the workflow's secrets, and nothing here moves.

nsis:
  oneClick: false
  # No folder page: an install goes to the usual per-user folder, and page 1
  # of installer.nsh picks the portable folder itself. installer.nsh stops the
  # build if this is turned back on.
  allowToChangeInstallationDirectory: false
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # The Install-or-Portable page, and the branch that skips the registry.
  include: installer.nsh
  # No .blockmap. updates.ts downloads the whole installer, which is simpler
  # than a patch and keeps the release to one Windows file.
  differentialPackage: false
  # The version is in the name, as in FileAnalyser's. updates.ts finds its file
  # in the latest release by the part before the version (INSTALLER_ASSET), so
  # keep "mbrd-Windows" exactly as it is. tests/desktop-package.test.js holds
  # the two in step.
  artifactName: mbrd-Windows-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: universal
  icon: icons/icon.icns
  category: public.app-category.graphics-design
  # .mbrd belongs to this app on macOS, where the bundle declares it. Under
  # mac: and not at the top level, because electron-builder hands a top-level
  # list to every platform, and on Windows installer.nsh registers .mbrd itself,
  # only when the Install card's box is ticked. `role: Editor` rather than
  # Viewer because opening one is opening it to work on.
  fileAssociations:
    - ext: mbrd
      name: mbrd board
      description: mbrd board
      mimeType: application/vnd.mbrd+zip
      role: Editor
  # No Apple Developer ID yet. null makes electron-builder skip signing, and
  # scripts/after-pack.cjs signs ad-hoc instead, so macOS offers Open Anyway
  # in Privacy & Security rather than calling the app damaged. Remove both once
  # a certificate exists: notarisation becomes possible then, and so do
  # installed updates.
  identity: null
  # The universal app joins an Intel and an Apple-silicon build of ONE
  # node_modules, so a native file that is not itself universal sits in both
  # halves unchanged, and @electron/universal refuses that unless this pattern
  # names it. Such a file is kept as it is. Three do: sharp's packages (the
  # release job installs the Intel pair beside the runner's own, and sharp picks
  # one by process.arch), onnxruntime-node (it ships no Intel Mac binary, so an
  # Intel Mac cuts out pictures with the browser's worker), and ffmpeg
  # (evermeet.cx builds it for Intel, and Apple silicon runs it through
  # Rosetta). If a merge ever fails past this, the fallback is
  # `arch: [arm64, x64]` and chip detection on the download page (plan §1).
  x64ArchFiles: '{**/node_modules/@img/**,**/node_modules/onnxruntime-node/**,Contents/Resources/ffmpeg/**}'

dmg:
  # No .dmg.blockmap: nothing reads it.
  writeUpdateInfo: false
  # The version in the name, as on Windows. macOS only opens the download page
  # (updates.ts), so no pattern reads this one.
  artifactName: mbrd-mac-universal-${version}.${ext}

linux:
  target: AppImage
  icon: icons/icon.png
  category: Graphics
  # An AppImage registers no MIME association without desktop integration the
  # user installs themselves, so open-with on Linux arrives with the .deb in
  # plan §10 and not here. The desktop entry is still correct for the launchers
  # that do integrate one.
  desktop:
    entry:
      MimeType: application/vnd.mbrd+zip

appImage:
  # The version in the name. updates.ts finds the AppImage by the part before it
  # (APPIMAGE_ASSET), so keep "mbrd-linux-x64" exactly as it is, written out
  # rather than built from ${arch}. tests/desktop-package.test.js holds the two
  # in step.
  artifactName: mbrd-linux-x64-${version}.${ext}

# No update file (latest*.yml) and no blockmap: updates.ts asks GitHub's API
# for the latest release, which gives each download URL and its SHA-256
# digest. `null` keeps electron-builder from inferring a GitHub target from the
# git remote and writing those files anyway.
publish: null

# macOS only: an ad-hoc signature, because there is no Apple certificate yet.
# See the file, and `mac.identity` above.
afterPack: ./scripts/after-pack.cjs
