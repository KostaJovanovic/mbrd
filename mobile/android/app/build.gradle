apply plugin: 'com.android.application'

android {
    namespace = "com.valjdakosta.mbrd"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.valjdakosta.mbrd"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 738
        versionName "0.738"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The update feed MbrdUpdate.java reads. Empty means no update check at
        // all, and it stays empty unless the build passes -PmbrdUpdateFeed=<url>.
        // Only .github/workflows/release.yml does, so a mobile.bat build never
        // checks. A Google Play build must not pass it: Play forbids an app
        // that updates itself.
        buildConfigField "String", "UPDATE_FEED", "\"${project.findProperty('mbrdUpdateFeed') ?: ''}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // The release key. The release workflow writes the keystore from the
    // repository secrets and names it in MBRD_KEYSTORE. Without that variable a
    // release build comes out unsigned, and a debug build keeps the debug key.
    // Keep the SAME keystore forever: Android refuses an update signed with
    // another key, so a new one would strand every installed copy.
    signingConfigs {
        release {
            def keystore = System.getenv('MBRD_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('MBRD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MBRD_KEY_ALIAS')
                // One password for the store and the key, unless a second is set.
                keyPassword System.getenv('MBRD_KEY_PASSWORD') ?: System.getenv('MBRD_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MBRD_KEYSTORE')) signingConfig signingConfigs.release
            // R8 drops what the libraries carry and nothing calls. The plugins
            // are reached by reflection; Capacitor's own consumer rules keep
            // them, and proguard-rules.pro keeps this app's classes whole.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MbrdShell and MbrdBytes call WebViewCompat. Capacitor has it as an
    // `implementation`, which does not reach this module.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // MbrdAuth: Google's Authorization API, for Google Drive's sign-in.
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
